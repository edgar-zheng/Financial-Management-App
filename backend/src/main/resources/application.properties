spring.config.import=optional:classpath:application-env.properties,optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.application.name=portfolio
server.port=${PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Expose only aggregate health, never credentials or diagnostic details.
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

#Hikari/Connector J properties
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:${AIVEN_TRUSTSTORE_PATH}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=JKS
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false

# Server-side market credential; actual value stays in the environment or ignored .env.
market.api.key=${MARKET_API_KEY:}

# Flyway owns schema evolution; do not silently baseline an existing database.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
