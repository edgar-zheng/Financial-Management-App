AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS entry point for the portfolio API using the default CloudFront domain.
Parameters:
  ElasticBeanstalkHostname:
    Type: String
    Description: Existing public EB hostname only, without scheme or path.
    AllowedPattern: '^[a-zA-Z0-9.-]+\.elasticbeanstalk\.com$'
Resources:
  ApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Portfolio dynamic session API
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: ElasticBeanstalk
            DomainName: !Ref ElasticBeanstalkHostname
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: ElasticBeanstalk
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          # AWS managed CachingDisabled: all TTLs zero.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # All cookies, queries and viewer headers except Host. Spring owns CORS.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: false
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
          - ErrorCode: 500
            ErrorCachingMinTTL: 0
          - ErrorCode: 502
            ErrorCachingMinTTL: 0
          - ErrorCode: 503
            ErrorCachingMinTTL: 0
          - ErrorCode: 504
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
Outputs:
  DistributionId:
    Value: !Ref ApiDistribution
  DistributionDomainName:
    Value: !GetAtt ApiDistribution.DomainName
  ApiBaseUrl:
    Value: !Sub 'https://${ApiDistribution.DomainName}'
