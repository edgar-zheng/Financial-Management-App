spring.config.import=optional:classpath:application-env.properties,optional:file:../.env[.properties],optional:file:./.env[.properties]
spring.application.name=portfolio
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_tracker
spring.datasource.username=portfolio_app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Server-side market credential; actual value stays in the environment or ignored .env.
market.api.key=${MARKET_API_KEY:}

# Flyway owns schema evolution; do not silently baseline an existing database.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
